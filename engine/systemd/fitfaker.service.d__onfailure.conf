[Unit]
# monitors v3, 2026-10-03, agreed with the Cycling lane: a failed unit becomes one line (unit name, time, status) in the morning ping; no journal content.
OnFailure=notify-failure@%n.service
[Unit]
# crash-loop guard (Cycling lane, 2026-10-03): a poison file ends in a failed unit that OnFailure reports, not a silent 20 s restart loop.
StartLimitIntervalSec=600
StartLimitBurst=5
